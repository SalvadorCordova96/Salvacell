worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 32;
}

http {
  access_log off;
  error_log /dev/stderr warn;

  server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 13m;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /mobile-photos.html { proxy_pass http://salvacel:8787; }
    location = /mobile-photos.js { proxy_pass http://salvacel:8787; }
    location = /mobile-photos.css { proxy_pass http://salvacel:8787; }

    location = /api/photos/redeem {
      client_max_body_size 8k;
      proxy_pass http://salvacel:8787;
    }

    location = /api/photos/upload {
      client_max_body_size 13m;
      proxy_pass http://salvacel:8787;
    }

    location / {
      return 404;
    }
  }
}
